<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フロリの ものがたり</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px system-ui,"Hiragino Sans","Yu Gothic",sans-serif;user-select:none;-webkit-user-select:none;background:#222;color:#2a3440}
#stage{position:fixed;inset:0;overflow:hidden;transition:background 0.8s;background:linear-gradient(#bfe7ff,#fff6cf)}
#stage[data-bg="home"]{background:linear-gradient(#bfe7ff 0%,#fff6cf 70%,#c9ecb6 70%,#a8dca0 100%)}
#stage[data-bg="dusk"]{background:linear-gradient(#ffb38a 0%,#c06a8a 55%,#7a5a9a 70%,#5d4a78 100%)}
#stage[data-bg="night"]{background:linear-gradient(#2a2550,#4a3a78 70%,#3a3060 100%)}
#stage[data-bg="castle"]{background:linear-gradient(#3a3050,#6a3a5a 70%,#4a2a40 100%)}
#stage[data-bg="sunrise"]{background:linear-gradient(#ffd9b8 0%,#ffe9a8 60%,#c9ecb6 60%,#a8dca0 100%)}
#stage[data-bg="swamp"]{background:linear-gradient(#cfeede 0%,#9fd8b8 55%,#5fae88 55%,#3f8f6a 100%)}
#stage[data-bg="forest"]{background:linear-gradient(#e8f3c8 0%,#b9d98a 55%,#7fb35a 55%,#5a9440 100%)}
#stage[data-bg="gate"]{background:linear-gradient(#4a3a5a 0%,#7a4a5a 60%,#3a2a3a 60%,#2a1a2a 100%)}
#stage[data-bg="alert"]{background:linear-gradient(#5a1a2a,#a02a3a 60%,#3a1020 100%)}
#stage[data-bg="title"]{background:linear-gradient(#ffd0d0,#ff9a9a)}
.prop{position:absolute;height:16vh;width:auto;transition:opacity 0.6s}
.actor{position:absolute;bottom:17vh;transform:translateX(-50%);height:34vh;aspect-ratio:calc(800*1.12)/calc(1003*1.06);pointer-events:none}
.actor canvas{width:100%;height:100%;display:block;transform-origin:50% 100%}
/* 大胆な表情の動き(動くフロリの腕は、そのまま動く) */
.a-shock canvas{animation:shock .45s ease-out 1,shake .12s linear .45s 8}
.a-sad canvas{animation:sad 1.2s ease-in-out infinite alternate}
.a-joy canvas{animation:joy .5s ease-in-out infinite alternate}
.a-angry canvas{animation:shake .1s linear infinite;filter:saturate(1.5) hue-rotate(-12deg)}
@keyframes shock{0%{transform:scale(.8)}50%{transform:scale(1.3,1.25)}100%{transform:scale(1.15)}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-1.2vh 0}75%{translate:1.2vh 0}}
@keyframes sad{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(1.04,.92) rotate(3deg)}}
@keyframes joy{from{transform:translateY(0) rotate(-5deg) scale(1.03)}to{transform:translateY(-3vh) rotate(5deg) scale(1.12)}}
.bubble{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);white-space:nowrap;padding:.5em .9em;background:#fff;border:3px solid #4a5560;border-radius:16px;font-weight:bold;font-size:2.4vh;opacity:0;transition:opacity .3s;z-index:3}
.bubble.on{opacity:1}
#foes img{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 1vh 1vh rgba(0,0,0,.4))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.85}to{opacity:0}}
#cap{position:fixed;left:3%;right:3%;bottom:2.5vh;min-height:11vh;box-sizing:border-box;padding:1.2vh 2vh;background:rgba(255,255,255,.95);border:4px solid #4a5560;border-radius:20px;text-align:center}
#who{font-size:2.2vh;font-weight:bold;color:#3a7aa8;min-height:2.6vh}
#line{font-size:3vh;font-weight:bold;line-height:1.5}
#title{position:absolute;inset:0;display:grid;place-items:center;font-size:8vh;font-weight:bold;color:#fff;text-shadow:0 .6vh 0 #c04040,.3vh 0 0 #c04040,-.3vh 0 0 #c04040;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center}
#title.on{opacity:1;animation:pop 1s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.08)}}
#bar{position:fixed;top:1.2vh;left:2%;right:2%;display:flex;gap:.8vh;justify-content:center;flex-wrap:wrap}
#bar button{font:inherit;font-size:1.9vh;font-weight:bold;padding:.4em .8em;border:3px solid #4a5560;border-radius:999px;background:#fff;cursor:pointer}
#bar button.on{background:#ffd0e4}
#prog{position:fixed;left:0;top:0;height:.8vh;background:#e4877d;width:0;transition:width .1s linear}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff6cf;font-weight:bold;font-size:3vh}
</style></head><body>
<div id="stage" data-bg="home">
  <div id="props"></div>
  <div id="actors"></div>
  <div id="foes"></div>
  <div id="title"></div>
  <div id="flash"></div>
</div>
<div id="prog"></div>
<div id="bar"></div>
<div id="cap"><div id="who"></div><div id="line"></div></div>
<div id="loading">よみこみちゅう…</div>
<script type="module" src="story-movie.js"></script>
</body></html>
