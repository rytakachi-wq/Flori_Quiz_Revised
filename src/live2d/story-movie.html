<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フロリの ものがたり</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px system-ui,"Hiragino Sans","Yu Gothic",sans-serif;user-select:none;-webkit-user-select:none;background:#111;color:#2a3440}
/* スマホの たて長の画面(9:16)の枠。大きい画面でも、まんなかに たて長で出す。たて長の さらに細長い画面では、たて いっぱい */
#phone{position:fixed;left:50%;top:0;transform:translateX(-50%);height:100vh;width:min(100vw,56.25vh);container-type:size;--u:1.28cqw;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
.bg{position:absolute;inset:0}   /* 背景は、すぐに入れかえる(ゆっくり重ねると、うしろの白っぽい色が見える) */
.bgs-home{background:linear-gradient(#bfe7ff 0%,#fff6cf 68%,#c9ecb6 68%,#a8dca0 100%)}
.bgs-dusk{background:linear-gradient(#ffb38a 0%,#c06a8a 55%,#7a5a9a 68%,#5d4a78 100%)}
.bgs-night{background:linear-gradient(#2a2550,#4a3a78 68%,#3a3060 100%)}
.bgs-castle{background:linear-gradient(#3a3050,#6a3a5a 68%,#4a2a40 100%)}
.bgs-sunrise{background:linear-gradient(#ffd9b8 0%,#ffe9a8 58%,#c9ecb6 58%,#a8dca0 100%)}
.bgs-swamp{background:linear-gradient(#cfeede 0%,#9fd8b8 52%,#5fae88 52%,#3f8f6a 100%)}
.bgs-forest{background:linear-gradient(#e8f3c8 0%,#b9d98a 52%,#7fb35a 52%,#5a9440 100%)}
.bgs-gate{background:linear-gradient(#4a3a5a 0%,#7a4a5a 58%,#3a2a3a 58%,#2a1a2a 100%)}
.bgs-alert{background:linear-gradient(#5a1a2a,#a02a3a 58%,#3a1020 100%)}
.bgs-title{background:linear-gradient(#ffd0d0,#ff9a9a)}
/* 場面を置く枠は、いつも 9:16(下にそろえる)。もっと細長い画面では、上に、空・背景が のびる */
#world{position:absolute;left:0;right:0;bottom:0;height:177.78cqw;will-change:transform}
.prop{position:absolute;width:auto;transform:translateX(-50%);filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*.5) rgba(0,0,0,.25))}
.actor{position:absolute;transform:translateX(-50%);pointer-events:none;height:calc(var(--u)*42);aspect-ratio:calc(800*1.12)/calc(1003*1.19)}
.actor canvas{width:100%;height:100%;display:block;transform-origin:50% 100%}
/* 体ぜんたいの動き(控えめ。場面に合わせて、ひとつずつ) */
.a-shock canvas{animation:shock .5s ease-out 1}
.a-sad canvas{animation:sad 2.4s ease-in-out infinite alternate}
.a-joy canvas{animation:joy .8s ease-in-out infinite alternate}
.a-sway canvas{animation:sway 2.8s ease-in-out infinite alternate}
.a-side canvas{animation:side .5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes side{from{transform:translateX(calc(var(--u)*-1.4))}to{transform:translateX(calc(var(--u)*1.4))}}
.a-bounce canvas{animation:bounce .55s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(calc(var(--u)*-1.6))}}
.a-joyr canvas{animation:joyr .8s ease-in-out infinite alternate}
@keyframes joyr{from{transform:translateY(0) rotate(6deg)}to{transform:translateY(calc(var(--u)*-2)) rotate(9deg)}}
.a-angry canvas{animation:shake .09s linear 7}
@keyframes shock{0%{transform:scale(.85)}45%{transform:scale(1.18,1.14)}100%{transform:scale(1.06)}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:calc(var(--u)*-.6) 0}75%{translate:calc(var(--u)*.6) 0}}
@keyframes sad{from{transform:scale(1,1) rotate(-1.5deg)}to{transform:scale(1.02,.96) rotate(1.5deg)}}
@keyframes joy{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(calc(var(--u)*-2)) rotate(3deg)}}
.bubble{position:absolute;bottom:96%;left:50%;transform:translateX(-50%);white-space:normal;width:max-content;max-width:calc(var(--u)*30);text-align:center;padding:.5em .9em;background:#fff;border:3px solid #4a5560;border-radius:16px;font-weight:bold;font-size:calc(var(--u)*2.6);opacity:0;transition:opacity .3s;z-index:3}
.bubble.on{opacity:1}
.mark{z-index:20;position:absolute;width:auto;pointer-events:none;opacity:0;filter:drop-shadow(0 calc(var(--u)*.4) calc(var(--u)*.4) rgba(0,0,0,.3))}
#title img{width:76%;height:auto}
#card{display:none;position:absolute;left:50%;top:calc(var(--u)*14);width:62%;transform:translateX(-50%);opacity:0;z-index:4}
#card.show{animation:cardIn 3.4s ease forwards}
@keyframes cardIn{0%{opacity:0;transform:translate(-50%,calc(var(--u)*-3))}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.foe{z-index:10;position:absolute;height:auto;width:auto;filter:drop-shadow(0 calc(var(--u)*.7) calc(var(--u)*.7) rgba(0,0,0,.35))}
.part{position:absolute;width:calc(var(--u)*5);height:auto;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .5s ease-out}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#fade.on{animation:fade .55s ease-out}
@keyframes flash{from{opacity:.85}to{opacity:0}}
@keyframes fade{from{opacity:1}to{opacity:0}}
#cap{position:absolute;left:3%;right:3%;bottom:2%;min-height:calc(var(--u)*11);box-sizing:border-box;padding:calc(var(--u)*1.2) calc(var(--u)*2);background:rgba(255,255,255,.96);border:4px solid #4a5560;border-radius:20px;text-align:center}
#who{font-size:calc(var(--u)*2.2);font-weight:bold;color:#3a7aa8;min-height:calc(var(--u)*2.6)}
#line{font-size:calc(var(--u)*3);font-weight:bold;line-height:1.5;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;line-break:strict;text-wrap:balance}   /* 文の折れ目は、ことばの切れ目で */
#title{position:absolute;inset:0;display:grid;place-items:start center;padding-top:calc(var(--u)*8);font-size:calc(var(--u)*8);font-weight:bold;color:#fff;text-shadow:0 calc(var(--u)*.5) 0 #c04040,calc(var(--u)*.25) 0 0 #c04040,calc(var(--u)*-.25) 0 0 #c04040;opacity:0;transition:opacity 2s;pointer-events:none;text-align:center}
#title.on{opacity:1}
#bar{position:absolute;top:1%;left:2%;right:2%;display:flex;gap:calc(var(--u)*.8);justify-content:center;flex-wrap:wrap;z-index:5}
#bar button{font:inherit;font-size:calc(var(--u)*1.9);font-weight:bold;padding:.35em .8em;border:3px solid #4a5560;border-radius:999px;background:#fff;cursor:pointer}
#bar button.on{background:#ffd0e4}
#x{position:absolute;right:2%;top:calc(var(--u)*9);z-index:6;font:inherit;font-size:calc(var(--u)*2.2);font-weight:bold;padding:.25em .8em;border:3px solid #4a5560;border-radius:999px;background:#fff;cursor:pointer}
#bar button:disabled{opacity:.45;cursor:default}
#koma{position:absolute;left:2%;top:calc(var(--u)*9);z-index:5;padding:.1em .6em;font-weight:bold;font-size:calc(var(--u)*2.4);color:#fff;background:rgba(0,0,0,.45);border-radius:999px}
#prog{position:absolute;left:0;top:0;height:calc(var(--u)*.7);background:#e4877d;width:0;transition:width .1s linear;z-index:6}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff6cf;font-weight:bold;font-size:calc(var(--u)*3.4);z-index:9}
</style></head><body>
<div id="phone">
<div id="stage">
  <div id="bgs"></div>
  <div id="world">
    <div id="props"></div>
    <div id="actors"></div>
    <div id="foes"></div>
    <div id="parts"></div>
    <div id="marks"></div>
  </div>
  <div id="title"></div>
  <img id="card" alt="">
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<div id="prog"></div>
<div id="koma"></div>
<button id="x" type="button">とじる</button>
<div id="bar"></div>
<div id="cap"><div id="who"></div><div id="line"></div></div>
<div id="loading">よみこみちゅう…</div>
</div><!-- /phone -->
</div>
<script type="module" src="story-movie.js?v=20261112a"></script>
</body></html>
